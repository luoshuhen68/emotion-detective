<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF6EF">
  <title>情绪侦探 · 生活语文小游戏</title>
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
  <a class="skip-link" href="#screen">跳到主要内容</a>

  <div class="app">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="回到游戏首页">
        <span class="brand-mark" aria-hidden="true">侦</span>
        <span class="brand-name">情绪侦探</span>
      </button>
      <div class="topbar-right">
        <span class="badge-count" id="badgeCount" aria-live="polite">徽章 0 / 14</span>
        <button class="btn btn-small" type="button" data-action="toggle-sound" id="soundBtn" aria-pressed="false">朗读：关</button>
        <button class="btn btn-small" type="button" data-action="teacher">教师</button>
      </div>
    </header>

    <main id="screen" class="screen"></main>

    <footer class="footer">
      生活语文 · 情绪学习小游戏 · 不用说话也能完成
    </footer>
  </div>

  <div id="modalRoot"></div>

  <script src="data.js?v=5"></script>
  <script src="game.js?v=5"></script>
</body>
</html>
